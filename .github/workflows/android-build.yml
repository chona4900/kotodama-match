name: Android Release AAB

on:
  workflow_dispatch:

jobs:
  build:
    name: Build signed Android App Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor for Android
        run: npx cap sync android

      - name: Run web and Android regression checks
        run: |
          npm test
          npm run online:test
          cd android
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug --stacktrace

      - name: Restore Android upload key
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          : "${ANDROID_UPLOAD_KEYSTORE_BASE64:?ANDROID_UPLOAD_KEYSTORE_BASE64 secret is required}"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kotodama-upload-key.p12"

      - name: Build signed release bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/kotodama-upload-key.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: kotodama-upload
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_TYPE: PKCS12
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.0.12
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: kotodama-match-android-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      # Google Play の申告用動画を先に撮れるよう、同じ署名鍵で直接インストール用APKも作る。
      # AABと同じビルド番号を使い、修正版APKを以前の検証版と区別する。
      - name: Build signed verification APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/kotodama-upload-key.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: kotodama-upload
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_TYPE: PKCS12
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.0.12-test
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload verification APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kotodama-match-android-test-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Verify release packaging and record hashes
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          root = pathlib.Path('.')
          results = []
          for artifact, prefix in [('android/app/build/outputs/bundle/release/app-release.aab', 'base/assets/public/'), ('android/app/build/outputs/apk/release/app-release.apk', 'assets/public/')]:
              file = root / artifact
              with zipfile.ZipFile(file) as package:
                  names = package.namelist()
                  assert not any('ai-companion' in name or 'prototypes/' in name for name in names), 'Prototype asset in release'
                  for asset in ['main.js', 'state-migrations.js', 'index.html', 'data.js']:
                      assert package.read(prefix + asset) == (root / asset).read_bytes(), f'Stale packaged asset: {asset}'
                  assert b'openCompanion' not in package.read(prefix + 'main.js'), 'Companion entry point in release'
              results.append({'file': artifact, 'sha256': hashlib.sha256(file.read_bytes()).hexdigest(), 'source_assets_match': True, 'ai_companion_excluded': True})
          (root / 'android-release-verification.json').write_text(json.dumps(results, indent=2) + '\n')
          print(json.dumps(results, indent=2))
          PY

      - name: Upload release verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: kotodama-match-android-verification
          path: |
            android-release-verification.json
            android/app/build/outputs/logs/manifest-merger-release-report.txt
            android/app/build/intermediates/merged_manifests/release/**/AndroidManifest.xml
          if-no-files-found: error
          retention-days: 14
