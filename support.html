    <title>コトダマっち サポート</title>
    <style>
        body { max-width: 760px; margin: 0 auto; padding: 32px 20px; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; line-height: 1.75; color: #182817; background: #f7faf4; }
        h1 { font-size: 1.7rem; } h2 { margin-top: 2rem; font-size: 1.2rem; } a { color: #196b35; }
    </style>
</head>
<body>
    <h1>コトダマっち サポート</h1>

    <h2>遊び方</h2>
    <p>MICボタンを押し、マイクと音声認識を許可してから、画面に表示される言霊を声に出してください。回数がたまるとコトダマっちが進化します。</p>

    <h2>音声が認識されないとき</h2>
    <ol>
        <li>端末の設定で、このアプリの「マイク」と「音声認識」が許可されているか確認してください。</li>
        <li>静かな場所で、言霊をはっきり発音してください。</li>
        <li>ほかのアプリがマイクを使用している場合は終了してください。</li>
    </ol>

    <h2>データを最初からやり直す</h2>
    <p>ゲーム画面の「B リセット」を選ぶと、端末内の育成データをタマゴの状態へ戻せます。</p>

    <h2>プライバシー</h2>
    <p><a href="privacy.html">プライバシーポリシーを読む</a></p>
</body>
</html>
